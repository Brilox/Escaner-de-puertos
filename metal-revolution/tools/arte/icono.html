<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BlackOps;src:url(fuentes/BlackOpsOne_400.woff2)}
html,body{margin:0;width:512px;height:512px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#1a2350 0%,#0b0f24 60%,#05070f 100%)}
svg{display:block}
</style></head><body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="azul" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#2d7cff"/><stop offset="0.55" stop-color="#1d3fa8"/><stop offset="1" stop-color="#14286e"/></linearGradient>
 <linearGradient id="rojo" x1="1" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#ff5a2a"/><stop offset="0.55" stop-color="#c41f1f"/><stop offset="1" stop-color="#7a1010"/></linearGradient>
 <linearGradient id="blanco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f2f5fb"/><stop offset="1" stop-color="#b9c3d8"/></linearGradient>
 <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="sombra"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.9"/></filter>
</defs>
<!-- el emblema del logo (hexagono partido azul y rojo), ampliado y centrado -->
<g filter="url(#brillo)" transform="translate(256 256) scale(1.75) translate(-256 -90)">
 <path d="M256 4 L176 30 L150 90 L176 150 L248 176 L248 150 L196 132 L178 90 L196 48 L248 30 Z" fill="url(#azul)" transform="translate(-4 -3)"/>
 <path d="M256 4 L336 30 L362 90 L336 150 L264 176 L264 150 L316 132 L334 90 L316 48 L264 30 Z" fill="url(#rojo)" transform="translate(4 3)"/>
</g>
<text x="256" y="300" text-anchor="middle" font-family="BlackOps" font-size="150" letter-spacing="2" fill="url(#blanco)" stroke="#0a0d1c" stroke-width="4" paint-order="stroke" filter="url(#sombra)">MO</text>
</svg></body></html>
