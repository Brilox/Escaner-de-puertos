<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Audiowide;src:url(fuentes/Audiowide_400.woff2)}
@font-face{font-family:BlackOps;src:url(fuentes/BlackOpsOne_400.woff2)}
@font-face{font-family:Bruno;src:url(fuentes/BrunoAceSC_400.woff2)}
@font-face{font-family:Exo2;src:url(fuentes/Exo2_900i.woff2)}
@font-face{font-family:Michroma;src:url(fuentes/Michroma_400.woff2)}
@font-face{font-family:Orbitron;src:url(fuentes/Orbitron_900.woff2)}
@font-face{font-family:Oxanium;src:url(fuentes/Oxanium_800.woff2)}
@font-face{font-family:ZenDots;src:url(fuentes/ZenDots_400.woff2)}
@font-face{font-family:Russo;src:url(fuentes/RussoOne_400.woff2)}
@font-face{font-family:Raj;font-weight:700;src:url(fuentes/Rajdhani_700.woff2)}
html,body{margin:0;background:transparent}
svg{display:block}
</style></head><body>
<svg id="logo" width="2048" height="724" viewBox="0 0 512 181" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="azul" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#2d7cff"/><stop offset="0.55" stop-color="#1d3fa8"/><stop offset="1" stop-color="#14286e"/></linearGradient>
 <linearGradient id="rojo" x1="1" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#ff5a2a"/><stop offset="0.55" stop-color="#c41f1f"/><stop offset="1" stop-color="#7a1010"/></linearGradient>
 <linearGradient id="blanco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f2f5fb"/><stop offset="1" stop-color="#b9c3d8"/></linearGradient>
 <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="sombra" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#05060f" flood-opacity="0.85"/></filter>
</defs>
<!-- emblema: hexagono partido (la "O" de Online), mitad azul y mitad roja, como sucesor de la "M" original -->
<g filter="url(#brillo)" opacity="0.97">
 <path d="M256 4 L176 30 L150 90 L176 150 L248 176 L248 150 L196 132 L178 90 L196 48 L248 30 Z" fill="url(#azul)" transform="translate(-4 -3)"/>
 <path d="M256 4 L336 30 L362 90 L336 150 L264 176 L264 150 L316 132 L334 90 L316 48 L264 30 Z" fill="url(#rojo)" transform="translate(4 3)"/>
 <path d="M150 90 L118 90 L130 84 L150 84 Z" fill="#2d7cff" opacity="0.9"/>
 <path d="M362 96 L394 96 L382 102 L362 102 Z" fill="#ff5a2a" opacity="0.9"/>
</g>
<!-- texto -->
<g filter="url(#sombra)">
 <text x="256" y="106" text-anchor="middle" id="t1" font-family="Russo" font-size="80" letter-spacing="3" fill="url(#blanco)" stroke="#0a0d1c" stroke-width="1.2" paint-order="stroke">METAL</text>
 <text x="259" y="146" text-anchor="middle" id="t2" font-family="Raj" font-weight="700" font-size="29" letter-spacing="15" fill="#e9edf6">ONLINE</text>
</g>
<rect x="104" y="136" width="40" height="2.4" fill="#3d8bff"/><rect x="370" y="136" width="40" height="2.4" fill="#ff5a2a"/>
</svg><script>
const q=new URLSearchParams(location.search);
if(q.get('f')){const t=document.getElementById('t1');t.setAttribute('font-family',q.get('f'));t.setAttribute('font-size',q.get('s')||80);t.setAttribute('letter-spacing',q.get('ls')||3);}
if(q.get('f2')){const t=document.getElementById('t2');t.setAttribute('font-family',q.get('f2'));t.setAttribute('font-size',q.get('s2')||24);t.setAttribute('letter-spacing',q.get('ls2')||12);}
</script></body></html>
